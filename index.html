<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stephan Leznikov</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/5bbe9fdfe0.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="xmb">
        <!-- Background layers -->
        <div class="xmb-bg" aria-hidden="true">
            <div class="xmb-bg-image"></div>
            <div class="xmb-bg-overlay"></div>
            <div class="xmb-bg-wave xmb-wave-1"></div>
            <div class="xmb-bg-wave xmb-wave-2"></div>
            <div class="xmb-bg-wave xmb-wave-3"></div>
        </div>

        <!-- Top header bar -->
        <header class="xmb-header">
            <img src="images/SL Logo.png" alt="Stephan Leznikov" class="xmb-header-logo">
            <span class="xmb-header-clock" id="xmb-clock"></span>
        </header>

        <!-- XMB cross navigation -->
        <main class="xmb-cross" id="xmb-cross">
            <!-- Horizontal category icons -->
            <div class="xmb-categories" id="xmb-categories" role="tablist" aria-label="Categories"></div>

            <!-- Category label -->
            <div class="xmb-cat-label" id="xmb-cat-label" aria-live="polite"></div>

            <!-- Vertical items list -->
            <div class="xmb-items-region" id="xmb-items-region">
                <div class="xmb-items" id="xmb-items" role="listbox" aria-label="Items"></div>
            </div>

            <!-- Item preview -->
            <div class="xmb-preview" id="xmb-preview" aria-live="polite"></div>
        </main>

        <!-- Content panel (slides in from right) -->
        <aside class="xmb-content" id="xmb-content" aria-hidden="true">
            <button class="xmb-back" id="xmb-back" aria-label="Go back">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
            <div class="xmb-content-body" id="xmb-content-body"></div>
        </aside>

        <!-- Footer navigation hints -->
        <footer class="xmb-footer" id="xmb-footer">
            <span class="xmb-hint xmb-hint--desktop"><kbd>&larr;</kbd><kbd>&rarr;</kbd> Navigate</span>
            <span class="xmb-hint xmb-hint--desktop"><kbd>&uarr;</kbd><kbd>&darr;</kbd> Browse</span>
            <span class="xmb-hint xmb-hint--desktop"><kbd>&crarr;</kbd> Open</span>
            <span class="xmb-hint xmb-hint--mobile">Swipe to navigate &bull; Tap to open</span>
        </footer>
    </div>

    <script src="xmb.js"></script>
</body>
</html>
