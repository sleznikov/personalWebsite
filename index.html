<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <base href="/">
    <title>Stephan Leznikov – AI Engineer &amp; Developer</title>
    <meta name="description" content="Personal portfolio of Stephan Leznikov — Computer Science &amp; AI student at Queen's University and AI/ML Intern at Kyndryl.">
    <link rel="canonical" href="https://stephan.leznikov.com/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Stephan Leznikov – AI Engineer &amp; Developer">
    <meta property="og:description" content="Personal portfolio of Stephan Leznikov — Computer Science &amp; AI student at Queen's University and AI/ML Intern at Kyndryl.">
    <meta property="og:url" content="https://stephan.leznikov.com/">
    <meta property="og:image" content="https://stephan.leznikov.com/images/sl-logo.png">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <meta name="theme-color" content="#080810">
    <link rel="preload" as="image" href="/images/FullSizeRender.jpg">
    <script>
        // SPA fallback decoder — pairs with 404.html to rewrite `/?/path` → `/path`
        (function (l) {
            if (l.search && l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }(window.location));
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="https://kit.fontawesome.com/5bbe9fdfe0.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="xmb-loader" role="status" aria-label="Loading">
        <div class="xmb-loader-inner">
            <div class="xmb-loader-logo-wrap">
                <img src="/images/sl-logo.png" alt="" class="xmb-loader-logo">
            </div>
            <div class="xmb-loader-bar"><div class="xmb-loader-bar-fill"></div></div>
        </div>
    </div>
    <div id="xmb">
        <!-- Background layers -->
        <div class="xmb-bg" aria-hidden="true">
            <video class="xmb-bg-video" id="xmb-bg-video" autoplay muted loop playsinline preload="auto">
                <source src="/background videos/PS3 XMP Wave - Blue (Blender Recreation).mp4" type="video/mp4">
            </video>
            <div class="xmb-bg-overlay"></div>
            <div class="xmb-bg-wave xmb-wave-1"></div>
            <div class="xmb-bg-wave xmb-wave-2"></div>
            <div class="xmb-bg-wave xmb-wave-3"></div>
        </div>

        <!-- Top header bar -->
        <header class="xmb-header">
            <img src="/images/sl-logo.png" alt="Stephan Leznikov" class="xmb-header-logo">
            <span class="xmb-header-clock" id="xmb-clock"></span>
        </header>

        <!-- XMB cross navigation -->
        <main class="xmb-cross" id="xmb-cross">
            <!-- Bar: horizontal row of category columns -->
            <div class="xmb-bar" id="xmb-bar"></div>
            <!-- Item preview text -->
            <div class="xmb-preview" id="xmb-preview" aria-live="polite"></div>
        </main>

        <!-- Content panel (slides in from right) -->
        <aside class="xmb-content" id="xmb-content" aria-hidden="true">
            <button class="xmb-back" id="xmb-back" aria-label="Go back">
                <i class="fa-solid fa-arrow-left"></i> Back
            </button>
            <div class="xmb-content-body" id="xmb-content-body"></div>
        </aside>

        <!-- Footer navigation hints -->
        <footer class="xmb-footer" id="xmb-footer">
            <span class="xmb-hint xmb-hint--desktop"><kbd>&larr;</kbd><kbd>&rarr;</kbd> Navigate</span>
            <span class="xmb-hint xmb-hint--desktop"><kbd>&uarr;</kbd><kbd>&darr;</kbd> Browse</span>
            <span class="xmb-hint xmb-hint--desktop"><kbd>&crarr;</kbd> Open</span>
            <span class="xmb-hint xmb-hint--mobile">Swipe to navigate &bull; Tap to open</span>
        </footer>
    </div>

    <script src="/xmb.js"></script>
</body>
</html>
